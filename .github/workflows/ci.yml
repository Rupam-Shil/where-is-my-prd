name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Shellcheck
        run: shellcheck -s sh skills/wheres-my-prd/scripts/validate-prd.sh scripts/*.sh tests/*.sh

      - name: Test suite (sh, dash, bash)
        run: sh tests/run.sh

      - name: Action validates the example PRDs
        uses: ./
        with:
          paths: examples/prd

      - name: Eval harness parses
        run: |
          python3 -m py_compile evals/run.py
          python3 -c "import json; json.load(open('evals/scenarios.json'))"
